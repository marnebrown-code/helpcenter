<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help Center</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <ol>
        <li><a href="/">Home</a></li>
        <li><span aria-current="page">Help Center</span></li>
      </ol>
    </nav>
    <h1>How can we help?</h1>
    <form class="search-bar" role="search">
      <input type="text" name="search" placeholder="Search for answers..." aria-label="Search" autocomplete="off" />
      <button type="submit" aria-label="Submit search">Search</button>
    </form>
  </header>

  <main class="content">
    <section class="categories">
      <h2>Browse by category</h2>
      <div class="category-grid">
        <a href="#" class="category-card">Getting Started</a>
        <a href="#" class="category-card">Account & Billing</a>
        <a href="#" class="category-card">Troubleshooting</a>
        <a href="#" class="category-card">FAQs</a>
      </div>
    </section>
  </main>
</body>
</html>
